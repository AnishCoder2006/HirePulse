services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - mongo
      - redis
      - ai-service
    ports:
      - "4000:4000"
    command: node src/server.js

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - mongo
      - redis
      - ai-service
    command: node src/workers/analysisWorker.js

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo-data:
